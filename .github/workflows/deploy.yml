name: Deploy to Cloudflare Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    # Publishes only after CI (HTML structure, i18n parity, links, secrets)
    # has succeeded on main — a broken push can never reach production.
    # Checks out the EXACT commit CI validated (race-proof under rapid pushes).
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Publish (wrangler pages deploy)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://chr-z.dev
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=chrz-dev --branch=main --commit-dirty=true

      - name: Verify production URL
        run: |
          sleep 20
          code=$(curl -s -o /dev/null -w '%{http_code}' https://chr-z.dev/)
          echo "GET https://chr-z.dev/ -> $code"
          test "$code" = "200"
